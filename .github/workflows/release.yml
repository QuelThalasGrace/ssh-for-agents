name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - run: mkdir -p dist

      - run: GOOS=darwin GOARCH=arm64 go build -o dist/sfa-darwin-arm64 ./cmd/sfa
      - run: GOOS=darwin GOARCH=amd64 go build -o dist/sfa-darwin-amd64 ./cmd/sfa
      - run: GOOS=linux GOARCH=amd64 go build -o dist/sfa-linux-amd64 ./cmd/sfa
      - run: GOOS=linux GOARCH=arm64 go build -o dist/sfa-linux-arm64 ./cmd/sfa
      - run: GOOS=windows GOARCH=amd64 go build -o dist/sfa-windows-amd64.exe ./cmd/sfa
      - run: GOOS=windows GOARCH=arm64 go build -o dist/sfa-windows-arm64.exe ./cmd/sfa

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
